name: Deploy static build to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Build static site
        run: bun run build

      - name: Detect build output directory
        id: detect
        run: |
          # Check the usual static output folders first.
          for d in dist/client .output/public dist build public server .; do
            if [ -f "$d/index.html" ]; then
              echo "dir=$d" >> "$GITHUB_OUTPUT"
              echo "Found index.html in $d"
              exit 0
            fi
          done

          # Fallback: search the repo for any generated index.html, regardless of folder layout.
          INDEX=$(find . -name index.html -not -path "./node_modules/*" -not -path "./.git/*" -print -quit || true)
          if [ -n "$INDEX" ]; then
            DIR=$(dirname "$INDEX")
            echo "dir=$DIR" >> "$GITHUB_OUTPUT"
            echo "Found index.html at $INDEX (using $DIR)"
            exit 0
          fi

          echo "index.html not found. Build output:"
          find . -name index.html -not -path "./node_modules/*" || true
          ls -la dist .output public server build 2>/dev/null || true
          exit 1

      - name: Fix absolute asset paths for subdirectory hosting
        run: |
          T="${{ steps.detect.outputs.dir }}/index.html"
          sed -i 's|"/\./assets/|"./assets/|g; s|"/assets/|"./assets/|g; s|"/favicon.ico|"./favicon.ico|g' "$T"
          grep -aoE '(src|href)="[^"]*"' "$T" | sort -u || true

      - name: Add .nojekyll (serve files as-is)
        run: touch "${{ steps.detect.outputs.dir }}/.nojekyll"

      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ${{ steps.detect.outputs.dir }}
          publish_branch: gh-pages
